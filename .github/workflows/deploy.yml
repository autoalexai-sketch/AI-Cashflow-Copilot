name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # ĐˇĐľĐ±Đ¸Ń€Đ°ĐµĐĽ Ń‡Đ¸ŃŃ‚Ń‹Đą Đ±Đ°Đ˝Đ´Đ» ŃĐ°ĐąŃ‚Đ° (Đ±ĐµĐ· docs/sql/ŃĐ»ŃĐ¶ĐµĐ±Đ˝Ń‹Ń… Ń„Đ°ĐąĐ»ĐľĐ˛)
      - name: Prepare site directory
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.md' \
            --exclude='*.sql' \
            ./ _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 33629195b33c5fd6d97096644551e0dd
          command: pages deploy _site --project-name=ai-cashflow-copilot-v2 --branch=main
