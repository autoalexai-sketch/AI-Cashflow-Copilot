<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- app-icon background: rounded square, brand gradient -->
  <rect width="512" height="512" rx="104" fill="url(#g)"/>
  <!-- SB monogram, centered as a single unit (text-anchor=middle handles both
       "S" and "B" together): S in white, B in light blue -- the product name
       and the two partners it's split between, in one lockup -->
  <text x="256" y="266" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="270" letter-spacing="-10"><tspan fill="#ffffff">S</tspan><tspan fill="#bae6fd">B</tspan></text>
</svg>
