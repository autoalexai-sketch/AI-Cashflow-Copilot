<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="leftHalf"><rect x="0" y="0" width="248" height="512"/></clipPath>
    <clipPath id="rightHalf"><rect x="264" y="0" width="248" height="512"/></clipPath>
  </defs>
  <!-- app-icon background: rounded square, brand gradient -->
  <rect width="512" height="512" rx="104" fill="url(#g)"/>
  <!-- a coin split into two halves with a gap down the middle: reads as
       "one pot of money, split between two partners" even at tiny sizes -->
  <circle cx="256" cy="256" r="146" fill="#ffffff" clip-path="url(#leftHalf)"/>
  <circle cx="256" cy="256" r="146" fill="#bae6fd" clip-path="url(#rightHalf)"/>
</svg>
